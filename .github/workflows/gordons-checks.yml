name: Gordons checks

on:
  pull_request:
    branches: [gordons]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gordons-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test OpenRestoApi.Tests/OpenRestoApi.Tests.csproj --configuration Release --verbosity minimal

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: openresto-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openresto-frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test -- --ci --runInBand
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: /api
      - run: npm run routes:check

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: python3 -m py_compile scripts/gordons-local.py

  arm64-images:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {context: ., dockerfile: OpenRestoApi/Dockerfile, name: backend}
          - {context: openresto-frontend, dockerfile: openresto-frontend/Dockerfile, name: frontend}
          - {context: nginx, dockerfile: nginx/Dockerfile, name: nginx}
          - {context: dev/gordons-gateway, dockerfile: dev/gordons-gateway/Dockerfile, name: gateway}
    steps:
      - uses: actions/checkout@v7
      - name: Build ARM64 image without publication
        run: docker build --build-arg EXPO_PUBLIC_API_URL=/api --file "${{ matrix.dockerfile }}" --tag "gordons-check:${{ matrix.name }}" "${{ matrix.context }}"
